<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- yellow circles -->
  <circle cx="560" cy="110" r="80" fill="#F3E51E"/>
  <circle cx="80" cy="890" r="75" fill="#F3E51E"/>
  <circle cx="1320" cy="960" r="62" fill="#F3E51E"/>

  <!-- blue target circles -->
  <circle cx="1040" cy="120" r="112" fill="none" stroke="#1E4E9A" stroke-width="2"/>
  <circle cx="1040" cy="120" r="45" fill="#1E4E9A"/>
  <circle cx="430" cy="910" r="76" fill="none" stroke="#1E4E9A" stroke-width="2"/>
  <circle cx="430" cy="910" r="32" fill="#1E4E9A"/>
  <circle cx="1500" cy="580" r="76" fill="none" stroke="#1E4E9A" stroke-width="2"/>
  <circle cx="1500" cy="580" r="32" fill="#1E4E9A"/>

  <!-- blue star shapes -->
  <polygon points="170,130 205,235 315,270 205,305 170,410 135,305 25,270 135,235" fill="#338AC0"/>
  <polygon points="1010,860 1040,945 1130,972 1040,1000 1010,1085 980,1000 890,972 980,945" fill="#338AC0"/>

  <!-- magenta diamonds -->
  <rect x="-70" y="410" width="160" height="160" transform="rotate(45 10 490)" fill="#A91D50"/>
  <rect x="1450" y="-40" width="160" height="160" transform="rotate(45 1530 40)" fill="#A91D50"/>
  <rect x="1390" y="800" width="180" height="180" transform="rotate(45 1480 890)" fill="#A91D50"/>

  <!-- green hexagons -->
  <polygon points="960,720 1060,660 1160,720 1160,840 1060,900 960,840" fill="#36AD32"/>
  <polygon points="1370,345 1450,300 1530,345 1530,435 1450,480 1370,435" fill="#36AD32"/>
  <polygon points="850,820 920,780 990,820 990,900 920,940 850,900" fill="#36AD32"/>

  <!-- subtle pale overlays -->
  <circle cx="250" cy="170" r="180" fill="#DDEAD4" opacity="0.35"/>
  <circle cx="1400" cy="190" r="220" fill="#DDEAD4" opacity="0.35"/>
  <circle cx="250" cy="720" r="210" fill="#DDEAD4" opacity="0.3"/>
</svg>
